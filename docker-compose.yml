services:
  client:
    build:
      context: ./
      dockerfile: ./client/Dockerfile
    working_dir: /app
    ports:
      - "${PORT_CLIENT}:3000"
    env_file:
      - .env
    depends_on:
      - server

  server:
    build:
      context: ./
      dockerfile: ./server/Dockerfile
    working_dir: /app
    ports:
      - "${PORT_SERVER}:${PORT_SERVER}"
    volumes:
      - ./server/static:/app/static
    env_file:
      - .env
    depends_on:
      - db

  db:
    build: ./mongodb_custom
    command:
      - "mongod"
      - "--replSet"
      - "rs0"
      - "--bind_ip_all"
      - "--auth"
      - "--keyFile"
      - "/data/keyfile/mongo.key"
    ports:
      - "${DB_EXTERNAL_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./database:/data/db
      - ./keys:/data/keyfile
