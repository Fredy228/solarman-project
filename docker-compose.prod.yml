services:
    client:
        build:
            context: .
            dockerfile: ./client/Dockerfile
            target: prod
        restart: unless-stopped

    server:
        build:
            context: .
            dockerfile: ./server/Dockerfile
            target: prod
        restart: unless-stopped
        depends_on:
            - db

    db:
        restart: unless-stopped

