events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Hide nginx version from response headers
    server_tokens off;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # --- Rate limiting (protect API from brute-force / DDoS) ---
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # --- Proxy cache for immutable static assets ---
    proxy_cache_path /var/cache/nginx/static
        levels=1:2
        keys_zone=static_cache:10m
        max_size=512m
        inactive=365d
        use_temp_path=off;

    # --- Proxy cache for Next.js optimized images ---
    proxy_cache_path /var/cache/nginx/next-image
        levels=1:2
        keys_zone=next_image_cache:50m
        max_size=2g
        inactive=30d
        use_temp_path=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_accept $next_image_format {
        default default;
        ~*image/avif avif;
        ~*image/webp webp;
    }

    # --- Upstreams with keepalive ---
    upstream client {
        server client:3000;
        keepalive 32;
    }

    upstream server {
        server server:${PORT_SERVER};
        keepalive 32;
    }

    # --- HTTP → HTTPS redirect ---
    server {
        listen 80;
        server_name ${NEXT_PUBLIC_SERVER_HOST};

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name ${NEXT_PUBLIC_SERVER_HOST};

        # --- SSL certificates ---
        ssl_certificate /etc/letsencrypt/live/${NEXT_PUBLIC_SERVER_HOST}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${NEXT_PUBLIC_SERVER_HOST}/privkey.pem;

        # --- SSL hardening ---
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # --- Security headers ---
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # --- General settings ---
        client_max_body_size 70M;

        # --- Common proxy settings ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Proxy timeouts and buffers ---
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 16 4k;
        proxy_buffer_size 8k;
        proxy_intercept_errors on;

        # --- Convert 502 (upstream down) → 503 (service unavailable) ---
        error_page 502 =503 @service_unavailable;
        location @service_unavailable {
            default_type text/html;
            add_header Retry-After 30 always;
            add_header Cache-Control "no-store" always;
            return 503 "<html><head><title>Service Unavailable</title></head><body><h1>503 Service Unavailable</h1><p>The service is temporarily unavailable. Please try again shortly.</p></body></html>";
        }

        # --- Static assets: long-term cache (Next.js hashed filenames) ---
        location /_next/static/ {
            proxy_pass http://client;
            proxy_cache static_cache;
            proxy_cache_valid 200 365d;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # --- Optimized images: cache generated /_next/image variants by size, quality and format ---
        location /_next/image {
            proxy_pass http://client;
            proxy_set_header Cookie "";
            proxy_cache next_image_cache;
            proxy_cache_key "$scheme$proxy_host$request_uri:$next_image_format";
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 30d;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # --- Static uploads: UUID filenames generated by the API ---
        location /api/static/ {
            proxy_pass http://server;
            proxy_cache static_cache;
            proxy_cache_valid 200 365d;
            proxy_ignore_headers Cache-Control Expires;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # --- SEO files can be cached briefly, but should refresh after content updates ---
        location = /robots.txt {
            proxy_pass http://client;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
        }

        location = /sitemap.xml {
            proxy_pass http://client;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
        }

        # --- Public assets (favicon, OG image, static images from /public) ---
        location ~* ^/[^/]+\.(?:jpg|jpeg|png|webp|gif|ico|svg)$ {
            proxy_pass http://client;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # --- Client (Next.js) ---
        location / {
            proxy_pass http://client;
        }

        # --- API: rate limited ---
        location /api {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://server;
        }
    }
}
