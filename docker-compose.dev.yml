services:
    client:
        build:
            target: dev
        command: sh -c "
            npm run dev
            "
        volumes:
            - ./client:/app/
            - /app/node_modules
        restart: no

    server:
        build:
            target: dev
        command: sh -c "
            && npm run prisma:deploy
            && npm run prisma:generate
            && npm run start:dev
            "
        volumes:
            - ./server:/app/
            - /app/node_modules
        restart: no

    db:
        restart: no

