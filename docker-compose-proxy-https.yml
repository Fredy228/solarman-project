services:
  nginx:
    image: nginx:1.29.4
    ports:
      - "${NGINX_PORT}:80"
      - "${NGINX_SSL_PORT}:443"
    command: >
      sh -c "
      envsubst '$${PORT_SERVER}, $${NEXT_PUBLIC_SERVER_HOST}'
      < /etc/nginx/templates/nginx.prod.conf > /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'
      "
    env_file:
      - .env
    volumes:
      - ./nginx:/etc/nginx/templates
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server
      - client
    restart: no
